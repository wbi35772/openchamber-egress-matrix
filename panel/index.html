<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Egress Matrix</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12h12M12 7l5 5-5 5M20 5v14"/></svg>
        </div>
        <div class="brand-text"><strong>EGRESS</strong><em>MATRIX</em></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="功能分组">
        <button class="tab" type="button" data-tab="overview">总览</button>
        <button class="tab" type="button" data-tab="lines">出口线路</button>
        <button class="tab" type="button" data-tab="nodes">节点池</button>
        <button class="tab" type="button" data-tab="subscriptions">订阅</button>
        <button class="tab" type="button" data-tab="upstream">上游</button>
        <button class="tab" type="button" data-tab="settings">设置</button>
      </nav>
      <div class="top-actions">
        <span class="pill" id="version-pill">v0.1.0</span>
        <button class="ghost" data-act="refresh" type="button">刷新</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="views">
      <section class="view" data-view="overview">
        <div id="summary" class="summary"></div>
        <section id="hero" class="hero" aria-live="polite"></section>
        <div class="grid">
          <section class="card">
            <header class="card-head">
              <h2>线路概览</h2>
              <span class="hint">一个租约一个稳定端口</span>
            </header>
            <div id="overview-lanes" class="lanes"></div>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>共享契约</h2>
              <span class="hint">其他扩展只认这里</span>
            </header>
            <div id="overview-paths" class="paths"></div>
            <p class="hint" id="overview-note"></p>
          </section>
        </div>
      </section>

      <section class="view" data-view="lines" hidden>
        <div class="grid">
          <section class="card wide">
            <header class="card-head">
              <h2>租约线路</h2>
              <div class="row-actions tight">
                <button class="ghost sm" data-act="probe-all" type="button">全部探测</button>
                <button class="ghost sm" data-act="reconcile" type="button">重新协调</button>
              </div>
            </header>
            <div id="leases" class="lanes"></div>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>新建租约</h2>
              <span class="hint">端口可显式钉住</span>
            </header>
            <form id="lease-form" class="stack-form">
              <label>节点 <select name="nodeId"></select></label>
              <label>key <input name="key" placeholder="ibk/account01" /></label>
              <label>端口 <input name="port" inputmode="numeric" placeholder="留空自动分配" /></label>
              <label>国家 <input name="country" placeholder="可选，如 TH" /></label>
              <div class="row-actions"><button class="primary" type="submit">创建租约</button></div>
            </form>
          </section>
        </div>
      </section>

      <section class="view" data-view="nodes" hidden>
        <div class="grid">
          <section class="card">
            <header class="card-head">
              <h2>手动添加节点</h2>
              <span class="hint">单条 URI</span>
            </header>
            <form id="node-form" class="stack-form">
              <label>名称 <input name="name" placeholder="可选" /></label>
              <label>节点 URI <input name="uri" placeholder="vless://… / trojan://… / socks5://…" /></label>
              <div class="row-actions"><button class="primary" type="submit">添加节点</button></div>
            </form>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>已接入节点</h2>
              <span class="hint" id="node-count"></span>
            </header>
            <div id="nodes" class="nodes"></div>
          </section>
        </div>
      </section>

      <section class="view" data-view="subscriptions" hidden>
        <div class="grid">
          <section class="card">
            <header class="card-head">
              <h2>添加订阅</h2>
              <span class="hint">整池导入</span>
            </header>
            <form id="sub-form" class="stack-form">
              <label>名称 <input name="name" placeholder="可选" /></label>
              <label>订阅 URL <input name="url" placeholder="https://…" /></label>
              <label>key 前缀 <input name="keyPrefix" placeholder="ibk" /></label>
              <label class="check"><input type="checkbox" name="autoLease" /> 导入后为每个节点自动建租约</label>
              <div class="row-actions"><button class="primary" type="submit">导入订阅</button></div>
            </form>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>订阅列表</h2>
              <span class="hint">同步不覆盖手动节点</span>
            </header>
            <div id="subscriptions" class="nodes"></div>
          </section>
        </div>
      </section>

      <section class="view" data-view="upstream" hidden>
        <div class="grid">
          <section class="card">
            <header class="card-head">
              <h2>proxygate API</h2>
              <span class="hint">槽位池接入</span>
            </header>
            <form id="pg-form" class="stack-form">
              <label>API 地址 <input name="baseUrl" placeholder="http://host:8080" /></label>
              <label>SOCKS 主机 <input name="socksHost" placeholder="host:port 或留空" /></label>
              <label>默认国家 <input name="country" placeholder="TH" /></label>
              <label>API Key <input name="authValue" type="password" autocomplete="off" /></label>
              <label>SOCKS 密码 <input name="socksPassword" type="password" autocomplete="off" /></label>
              <div class="row-actions"><button class="primary" type="submit">保存上游</button></div>
            </form>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>槽位操作</h2>
              <span class="hint">同步 / 分配 / 换 IP</span>
            </header>
            <div class="row-actions">
              <button class="ghost" data-act="pg-sync" type="button">同步槽位</button>
              <button class="ghost" data-act="pg-allocate" type="button">分配一个</button>
              <button class="ghost" data-act="pg-rotate" type="button">换出口 IP</button>
            </div>
            <div id="pg-result" class="result"></div>
          </section>
        </div>
      </section>

      <section class="view" data-view="settings" hidden>
        <div class="grid">
          <section class="card">
            <header class="card-head">
              <h2>监听与端口池</h2>
              <span class="hint">改端口池需重新协调</span>
            </header>
            <form id="settings-form" class="stack-form">
              <label>默认端口 <input name="defaultPort" inputmode="numeric" /></label>
              <label>池起点 <input name="portBase" inputmode="numeric" /></label>
              <label>池大小 <input name="portSize" inputmode="numeric" /></label>
              <label>探测地址 <input name="probeUrl" /></label>
              <div class="row-actions"><button class="primary" type="submit">保存设置</button></div>
            </form>
          </section>
          <section class="card">
            <header class="card-head">
              <h2>契约文件</h2>
              <span class="hint">写入本机文件</span>
            </header>
            <div id="paths" class="paths"></div>
            <div class="row-actions">
              <button class="ghost" data-act="reconcile" type="button">重新协调</button>
              <button class="ghost" data-act="probe-all" type="button">全部探测</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span id="foot-note">装入即用 · 无外部配置文件</span>
      <span class="foot-state" id="foot-state"></span>
    </footer>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="./main.js"></script>
</body>
</html>
